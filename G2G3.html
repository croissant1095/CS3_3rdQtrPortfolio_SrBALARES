<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta name="author" content="Ryan Gavin Balares">
        <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="G2.css">
        <title>Q3 G2 and G3 - HTML Form</title>
    </head>

    <body>
        <header>
            <h1>Club Application Form</h1>
            <br>
        </header>
        <main>
            <div>
            <form id="clubform">
                <label for="studentID">Student ID</label>
                <input type="number" id="studentID" name="studentID" required onblur="change_color('studentID')"><br>
                <label for="fname">Full Name</label>
                <input type="text" id="fname" name="fname" required onblur="change_color('fname')"><br>
                <label for="bday">Birthday</label>
                <input type="date" id="bday" name="bday" required onblur="change_color('bday')"><br>
                <label for="email">Email Address</label>
                <input type="text" id="email" name="email" required onblur="change_color('email')"><br>
                <label for="phone">Mobile Phone</label>
                <input type="text" id="phone" name="phone" required onblur="change_color('phone')"><br>
                <label for="grade">Grade Level</label>
                <select name="grade" id="grade" required>
                    <option value=""> --Select-- </option>
                    <option value="seven">Grade 7</option>
                    <option value="eight">Grade 8</option>
                    <option value="nine">Grade 9</option>
                    <option value="ten">Grade 10</option>
                    <option value="eleven">Grade 11</option>
                    <option value="twelve">Grade 12</option>
                </select><br>
                <p>Intern/Extern:</p>
                <input type="radio" id="intern" name="living" value="intern" required checked>
                <label for="intern">Intern</label><br>
                <input type="radio" id="extern" name="living" value="extern" required checked>
                <label for="extern">Extern</label><br>
                <label for="club">Preferred Organization/Club</label>
                <select name="club" id="club" required>
                    <option value=""> --Select-- </option>
                    <option value="computron">Computron</option>
                    <option value="himigAgham">Himig Agham</option>
                    <option value="bravura">Bravura</option>
                    <option value="sightlines">Sightlines</option>
                    <option value="invictus">Invictus</option>
                </select><br>
                <label for="reason">Why do you want to join?</label><br>
                <textarea required name="reason" id="reason" rows="4" cols="50" onblur="change_color('reason')"></textarea><br>
                <input id="submit" type="submit" value="Submit">
                <input onclick="return reset_confirm()" type="reset" value="Reset">
            </form>
            </div>
            <!-- fix link -->
            <a id="link" href="https://croissant1095.github.io/CS3_3rdQtrPortfolio_SrBALARES/sign_up.html">View Sign-Ups List</a>
        </main>

        <script>
            function reset_confirm() {
                return confirm("Do you want to reset your form information?")
            }

            // gooofy color change :0
            function change_color(id) {
                const thing = document.getElementById(id);
                thing.style.border = "solid forestgreen";
            }

            // Start of G3 Progress - localStorage :((
            // this HTML file handles the collection of data, then loading & saving onto local storage

            // key for localstorage pair containing signups stored as constant
            const KEY = "signups";

            function loadSignUps() {
                const raw = localStorage.getItem(KEY);
                return raw ? JSON.parse(raw) : [];
            }

            function saveSignUps(signUps) {
                localStorage.setItem(KEY, JSON.stringify(signUps));
            }

            function showRedirect() {
                const signUpsLink = document.getElementById("link");
                signUpsLink.style.display = 'inline';
            }
            const form = document.getElementById('clubform');
            form.onsubmit = e => {
                e.preventDefault();
                const studentID = document.getElementById('studentID').value.trim();
                const fname = document.getElementById('fname').value.trim();
                const bday = document.getElementById("bday").value.trim();
                const email = document.getElementById('email').value.trim();
                const phone = document.getElementById('phone').value.trim();
                const grade = document.getElementById('grade').value.trim();
                const living = document.querySelector('input[name="living"]:checked').value.trim();
                const club = document.getElementById('club').value.trim();
                const reason = document.getElementById('reason').value.trim();

                if (!studentID||!fname||!bday||!email||!phone||!grade||!living||!club||!reason) return;

                const signUp = {
                    studentID: studentID,
                    fname: fname,
                    bday: bday,
                    email: email,
                    phone: phone,
                    grade: grade,
                    living: living,
                    club: club,
                    reason: reason,
                }

                const signUps = loadSignUps();
                signUps.push(signUp);
                saveSignUps(signUps);
                showRedirect();
            }
            // flow:
            // - users submits data 
            // - form submission is detected, data is stored in object
            // - object containing other signups is taken out, and the new signup is pushed
            // - this new object is saved into localStorage
        </script>
    </body>
</html>
